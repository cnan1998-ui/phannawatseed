<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บัตรสะสมแต้ม - ร้านพรรณวัฒน์</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-stone-50 min-h-screen text-slate-800 pb-12">

    <!-- Header & Profile Section -->
    <header class="bg-emerald-700 text-white pt-8 pb-16 px-4 rounded-b-3xl shadow-lg relative">
        <div class="max-w-md mx-auto text-center">
            <h1 class="text-2xl font-semibold tracking-wide">ร้านพรรณวัฒน์</h1>
            <p class="text-emerald-100 text-sm mt-1">ศูนย์รวมชุดเพาะปลูกและอุปกรณ์การเกษตร</p>
            
            <div id="profile-container" class="mt-6 flex flex-col items-center justify-center">
                <img id="user-picture" src="https://via.placeholder.com/80" class="w-20 h-20 rounded-full border-4 border-white/30 shadow-md object-cover bg-emerald-800">
                <h2 id="user-name" class="mt-2 text-lg font-medium">กำลังโหลดข้อมูล...</h2>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-md mx-auto px-4 -mt-10 space-y-6">
        
        <!-- Loyalty Card / Stamps -->
        <section class="bg-white rounded-2xl p-6 shadow-md border border-emerald-100 text-center">
            <h3 class="text-xs uppercase tracking-wider text-slate-400 font-semibold mb-1">แต้มสะสมของคุณ</h3>
            <div class="flex items-center justify-center space-x-2 my-2">
                <span id="user-points" class="text-5xl font-bold text-emerald-600">5</span>
                <span class="text-slate-500 font-medium self-end mb-1">แต้ม</span>
            </div>
            
            <!-- Progress Bar -->
            <div class="w-full bg-slate-100 rounded-full h-3 mt-4 overflow-hidden">
                <div id="progress-bar" class="bg-emerald-500 h-3 rounded-full transition-all duration-500" style="width: 41%"></div>
            </div>
            <p id="progress-text" class="text-xs text-slate-500 mt-2">สะสมอีก 1 แต้ม เพื่อแลกรับ ดินปลูก 1 ถุง</p>
        </section>

        <!-- Rewards Section -->
        <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
            <h3 class="text-base font-semibold text-slate-800 mb-3 flex items-center">
                <span class="mr-2">🎁</span> รายการของรางวัล (เลือกช่องทางแลก)
            </h3>
            <div class="space-y-3">
                <!-- รางวัลที่ 1: 3 แต้ม -->
                <div class="p-3 bg-emerald-50/50 rounded-xl border border-emerald-100">
                    <div class="flex justify-between items-center mb-2">
                        <div>
                            <p class="font-medium text-emerald-900 text-sm">ฟรี! เมล็ดผัก 1 ชุด</p>
                            <span class="text-xs text-emerald-700 font-semibold">3 แต้ม</span>
                        </div>
                    </div>
                    <div class="flex gap-2 mt-2">
                        <button onclick="openStoreClaim('เมล็ดผัก 1 ชุด', 3)" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white text-xs py-2 rounded-lg font-medium shadow">🏪 แลกหน้าร้าน (รับโค้ด)</button>
                        <button onclick="openOnlineForm('เมล็ดผัก 1 ชุด', 3)" class="flex-1 bg-teal-600 hover:bg-teal-700 text-white text-xs py-2 rounded-lg font-medium shadow">📦 แลกออนไลน์ (ส่งแอดมิน)</button>
                    </div>
                </div>

                <!-- รางวัลที่ 2: 6 แต้ม -->
                <div class="p-3 bg-emerald-50/50 rounded-xl border border-emerald-100">
                    <div class="flex justify
